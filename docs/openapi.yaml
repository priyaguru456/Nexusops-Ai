openapi: 3.0.3
info:
  title: NexusOps AI Enterprise Operations API
  version: 1.0.0
  description: |
    REST and SSE streaming API for NexusOps AI, a multi-tenant internal operations,
    workflow approval, document management, and Retrieval-Augmented Generation (RAG) platform.

    **Authentication & Security**
    - Short-lived JWT Access Tokens (`Authorization: Bearer <token>`) paired with rotating `httpOnly` Refresh Token cookies.
    - Public email-token password recovery (`/auth/forgot-password`, `/auth/reset-password`).
    - Multi-tenant isolation keyed by `organizationId` across tenant-scoped resources and pgvector retrieval.
    - Hierarchical RBAC: `EMPLOYEE` < `MANAGER` < `ADMIN` < `SUPER_ADMIN` (platform governance).
servers:
  - url: /api
    description: Relative API prefix (Nginx reverse proxy / frontend integration)
  - url: http://localhost:4000/api
    description: Local Express API server
tags:
  - name: Health
    description: Service readiness and PostgreSQL connectivity probes
  - name: Auth
    description: Authentication, session rotation, and password recovery
  - name: Organizations
    description: Super Admin multi-tenant organization provisioning and governance
  - name: Users
    description: User directory administration, roles, and account activation
  - name: Requests
    description: Work request lifecycle, submissions, status transitions, and attachments
  - name: Tasks
    description: Operational tasks derived from approved requests
  - name: Approvals
    description: Multi-step approval queues and configurable approval flows
  - name: Comments
    description: Threaded discussions attached to requests and tasks
  - name: Documents
    description: Knowledge base document ingestion, versioning, and binary download
  - name: AI Assistant
    description: RAG Q&A streaming chat, session management, feedback, and retrieval debugging
  - name: Analytics
    description: Operational metrics, AI usage telemetry, CSV exports, and digest schedules
  - name: Search
    description: Cross-entity global workspace search
  - name: Announcements
    description: Company and department communications with read tracking
  - name: Directory
    description: Employee directory, organizational chart, and team hierarchy
  - name: Assets
    description: IT hardware inventory, assignments, returns, and retirements
  - name: Policies
    description: Policy distribution, versioning, and employee acknowledgements
  - name: Leaves
    description: Leave balances, company holidays, and PTO approval workflows
  - name: Calendar
    description: Unified calendar of holidays, leave schedules, and due dates
  - name: Expenses
    description: Expense claim drafts, receipt uploads, itemization, and reimbursement
  - name: Surveys
    description: CSAT feedback prompts, survey builders, and aggregated results
  - name: Notifications
    description: In-app user notifications and read counters
  - name: Audit Logs
    description: Compliance audit trail query and CSV export
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health and database readiness check
      security: []
      responses:
        "200":
          description: Service and PostgreSQL are healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: nexusops-api }
                  timestamp: { type: string, format: date-time }
                  database: { type: string, example: connected }
        "503":
          description: Database unreachable

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new employee account in a workspace
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                departmentId: { type: string, format: uuid }
                organizationSlug:
                  type: string
                  example: default
                  description: Optional target organization slug (defaults to platform default workspace)
      responses:
        "201":
          description: Registered user and initial access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: Target organization is suspended
        "404":
          description: Organization slug not found
        "409":
          description: Email already registered

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated user session and access token (sets refreshToken httpOnly cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Invalid credentials
        "403":
          description: Account deactivated or organization suspended
        "429":
          description: Rate limit exceeded

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token cookie and issue a fresh access token
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Fresh JWT access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        "401":
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token session and clear cookie
      security: []
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a single-use password reset link via email
      description: Always returns a generic success message to prevent email enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"
        "429":
          description: Password reset request rate limit exceeded

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Consume a password reset token and update password
      description: Validates token hash and expiry, updates password hash, and revokes all active refresh tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"
        "400":
          description: Invalid or expired reset token

  /auth/me:
    get:
      tags: [Auth]
      summary: Fetch current authenticated user profile
      responses:
        "200":
          description: User profile with department and organization summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
    patch:
      tags: [Auth]
      summary: Update current user display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
      responses:
        "200":
          description: Updated user object

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password while authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"

  /organizations:
    get:
      tags: [Organizations]
      summary: List all tenant organizations (SUPER_ADMIN only)
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: isActive
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated organization records with entity counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      tags: [Organizations]
      summary: Provision a new tenant organization and optional initial admin (SUPER_ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 2 }
                slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
                adminName: { type: string }
                adminEmail: { type: string, format: email }
                adminPassword: { type: string, minLength: 8 }
      responses:
        "201":
          description: Created organization and optional initial admin account
        "409":
          description: Slug or admin email conflict

  /organizations/{id}:
    get:
      tags: [Organizations]
      summary: Get single organization details and usage counts (SUPER_ADMIN only)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Organization detail payload
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [Organizations]
      summary: Update organization name, slug, or active status (SUPER_ADMIN only)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                isActive: { type: boolean }
      responses:
        "200":
          description: Updated organization

  /users:
    get:
      tags: [Users]
      summary: List tenant users with search, role, and status filters (ADMIN / SUPER_ADMIN)
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: role
          schema:
            $ref: "#/components/schemas/Role"
        - in: query
          name: isActive
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated list of users

  /users/me:
    patch:
      tags: [Users]
      summary: Update authenticated user name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: Updated user

  /users/me/password:
    post:
      tags: [Users]
      summary: Change current user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"

  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Assign user role within organization (ADMIN; SUPER_ADMIN for SUPER_ADMIN promotion)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "200":
          description: Updated user role

  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user account (ADMIN / SUPER_ADMIN)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        "200":
          description: Updated account activation state

  /requests:
    get:
      tags: [Requests]
      summary: List work requests scoped by tenant and user role
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: priority
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        "200":
          description: Paginated work requests
    post:
      tags: [Requests]
      summary: Create a draft or submitted work request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkRequestInput"
      responses:
        "201":
          description: Created work request

  /requests/counts:
    get:
      tags: [Requests]
      summary: Get status count breakdown for accessible requests
      responses:
        "200":
          description: Status count map

  /requests/{id}:
    get:
      tags: [Requests]
      summary: Retrieve single work request details
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Detailed work request including approval steps and attachments
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags: [Requests]
      summary: Edit a draft work request
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkRequestInput"
      responses:
        "200":
          description: Updated work request

  /requests/{id}/activity:
    get:
      tags: [Requests]
      summary: View activity and audit history for a request
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Chronological activity items

  /requests/{id}/submit:
    post:
      tags: [Requests]
      summary: Submit a draft request into the configured approval workflow
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Request transitioned to SUBMITTED or IN_REVIEW

  /requests/{id}/cancel:
    post:
      tags: [Requests]
      summary: Cancel a work request
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Cancelled request

  /requests/{id}/status:
    patch:
      tags: [Requests]
      summary: Transition an approved request status (IN_PROGRESS / COMPLETED)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [IN_PROGRESS, COMPLETED] }
      responses:
        "200":
          description: Updated request status

  /requests/{id}/attachments:
    post:
      tags: [Requests]
      summary: Upload file attachments onto a work request
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Attachment metadata saved

  /tasks:
    get:
      tags: [Tasks]
      summary: List operational tasks scoped by tenant and assignee permissions
      responses:
        "200":
          description: Paginated task list
    post:
      tags: [Tasks]
      summary: Create a task linked to an approved request or standalone (MANAGER / ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInput"
      responses:
        "201":
          description: Created task

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Fetch single task detail
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Task record
    patch:
      tags: [Tasks]
      summary: Update task status or fields
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [TODO, IN_PROGRESS, BLOCKED, DONE] }
                title: { type: string }
                priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
      responses:
        "200":
          description: Updated task
    delete:
      tags: [Tasks]
      summary: Delete a task (ADMIN)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"

  /tasks/{id}/assign:
    patch:
      tags: [Tasks]
      summary: Reassign a task to an organization user (MANAGER / ADMIN)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              properties:
                assigneeId: { type: string, format: uuid }
      responses:
        "200":
          description: Reassigned task

  /approval-flows:
    get:
      tags: [Approvals]
      summary: List approval workflow definitions for the organization
      responses:
        "200":
          description: Approval flow definitions
    post:
      tags: [Approvals]
      summary: Create a multi-step approval workflow rule (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, steps]
              properties:
                name: { type: string }
                category: { type: string, nullable: true }
                minPriority: { type: string, nullable: true }
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      stepOrder: { type: integer }
                      approverRole: { $ref: "#/components/schemas/Role" }
                      approverId: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Created approval flow

  /approval-flows/{id}:
    get:
      tags: [Approvals]
      summary: Retrieve single approval flow definition
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Approval flow
    patch:
      tags: [Approvals]
      summary: Update an approval flow definition (ADMIN)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Updated approval flow
    delete:
      tags: [Approvals]
      summary: Delete an approval flow definition (ADMIN)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"

  /approvals/pending:
    get:
      tags: [Approvals]
      summary: Retrieve approval steps currently awaiting the caller action
      responses:
        "200":
          description: Pending approval steps

  /approvals/bulk-approve:
    post:
      tags: [Approvals]
      summary: Approve multiple pending approval steps in one batch (MANAGER / ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stepIds]
              properties:
                stepIds:
                  type: array
                  items: { type: string, format: uuid }
                decisionNote: { type: string }
      responses:
        "200":
          description: Summary of approved steps

  /approvals/{stepId}/approve:
    post:
      tags: [Approvals]
      summary: Approve an individual workflow step
      parameters:
        - $ref: "#/components/parameters/StepId"
      responses:
        "200":
          description: Approved step and updated entity status

  /approvals/{stepId}/reject:
    post:
      tags: [Approvals]
      summary: Reject a workflow step with mandatory decision note
      parameters:
        - $ref: "#/components/parameters/StepId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisionNote]
              properties:
                decisionNote: { type: string }
      responses:
        "200":
          description: Rejected step and parent entity state

  /approvals/{stepId}/reassign:
    post:
      tags: [Approvals]
      summary: Reassign a pending approval step to another eligible approver
      parameters:
        - $ref: "#/components/parameters/StepId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approverId]
              properties:
                approverId: { type: string, format: uuid }
      responses:
        "200":
          description: Reassigned approval step

  /comments:
    get:
      tags: [Comments]
      summary: List comments for a request or task
      parameters:
        - in: query
          name: requestId
          schema: { type: string, format: uuid }
        - in: query
          name: taskId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Chronological comments list
    post:
      tags: [Comments]
      summary: Post a new comment onto a work request or task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                requestId: { type: string, format: uuid }
                taskId: { type: string, format: uuid }
      responses:
        "201":
          description: Created comment

  /documents:
    get:
      tags: [Documents]
      summary: List knowledge base documents visible to the caller
      responses:
        "200":
          description: Paginated documents filtered by tenant and DocVisibility rules
    post:
      tags: [Documents]
      summary: Upload a document (PDF, DOCX, TXT, MD, CSV) and enqueue background RAG indexing
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file: { type: string, format: binary }
                title: { type: string }
                category: { type: string }
                visibility:
                  type: string
                  enum: [ALL, DEPARTMENT, MANAGERS, ADMIN_ONLY]
                departmentId: { type: string, format: uuid }
      responses:
        "201":
          description: Document queued with status UPLOADED

  /documents/{id}:
    get:
      tags: [Documents]
      summary: Retrieve document metadata and ingestion status
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Document detail
    delete:
      tags: [Documents]
      summary: Delete document, chunks, and disk file (ADMIN)
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          $ref: "#/components/responses/MessageSuccess"

  /documents/{id}/file:
    get:
      tags: [Documents]
      summary: Download raw document file if permitted
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Binary file stream

  /documents/{id}/reprocess:
    post:
      tags: [Documents]
      summary: Re-enqueue document extraction and embedding pipeline
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "202":
          description: Document queued for reprocessing

  /documents/{id}/versions:
    post:
      tags: [Documents]
      summary: Upload a new document version and supersede previous chunks
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Version uploaded and queued

  /ai/chat:
    post:
      tags: [AI Assistant]
      summary: Ask a question grounded in tenant-permitted knowledge documents (SSE stream)
      description: Streams Server-Sent Events (`citations`, `token`, `done`) grounded strictly via pgvector + PostgreSQL full-text hybrid search with RRF scoring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 2 }
                sessionId: { type: string, format: uuid }
      responses:
        "200":
          description: Server-Sent Events stream with tokens and page-level citations
          content:
            text/event-stream:
              schema:
                type: string

  /ai/sessions:
    get:
      tags: [AI Assistant]
      summary: List caller AI chat sessions within their organization
      responses:
        "200":
          description: Chat session history list

  /ai/sessions/{id}:
    get:
      tags: [AI Assistant]
      summary: Retrieve full message history for a chat session
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Chat session and messages
    patch:
      tags: [AI Assistant]
      summary: Rename an AI chat session
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
      responses:
        "200":
          description: Renamed session
