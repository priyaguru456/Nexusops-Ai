components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived JWT access token (~15m) signed with JWT_ACCESS_SECRET
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Rotating httpOnly refresh token cookie scoped to /api/auth/refresh

  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    StepId:
      in: path
      name: stepId
      required: true
      schema:
        type: string
        format: uuid

  responses:
    MessageSuccess:
      description: Operation completed successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: Insufficient permissions or suspended organization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Resource not found within accessible tenant scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Role:
      type: string
      enum: [EMPLOYEE, MANAGER, ADMIN, SUPER_ADMIN]

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        isActive: { type: boolean }
        organizationId: { type: string, format: uuid, nullable: true }
        departmentId: { type: string, format: uuid, nullable: true }
        managerId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    AuthSessionResponse:
      type: object
      properties:
        accessToken: { type: string }
        user: { $ref: "#/components/schemas/User" }

    CreateWorkRequestInput:
      type: object
      required: [title, description, category]
      properties:
        title: { type: string, minLength: 3 }
        description: { type: string }
        category: { type: string, enum: [IT, HR, FINANCE, FACILITIES, OTHER] }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        dueDate: { type: string, format: date-time, nullable: true }
        submitImmediately: { type: boolean, default: false }

    CreateTaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        requestId: { type: string, format: uuid, nullable: true }
        assigneeId: { type: string, format: uuid, nullable: true }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        dueDate: { type: string, format: date-time, nullable: true }

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
        details: { type: object, additionalProperties: true }
