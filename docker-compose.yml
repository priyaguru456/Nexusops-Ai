x-api-environment: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 4000
  CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexusops_ai}?schema=public
  DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexusops_ai}?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local_dev_jwt_access_secret_at_least_32_characters_long}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local_dev_jwt_refresh_secret_at_least_32_characters_long}
  JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
  JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
  UPLOAD_DIR: /app/uploads
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-3-5-sonnet-20241022}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-NexusOps AI <noreply@nexusops.com>}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexusops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nexusops_ai}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexusops_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexusops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: nexusops-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexusops_ai}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexusops_ai}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: nexusops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    environment:
      <<: *api-env
    volumes:
      - uploads_data:/app/uploads

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: nexusops-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-env
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "const c=require('fs').readFileSync('/proc/1/cmdline','utf8');process.exit(c.includes('worker.js')?0:1)"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: nexusops-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
