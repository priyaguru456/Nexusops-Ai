server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Match backend upload limit (20 MB) with headroom for multipart boundaries
    client_max_body_size 25M;

    # Lightweight Nginx container healthcheck
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Reverse proxy API, Swagger UI (/api/docs), and SSE AI streaming to Express backend
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Disable buffering for real-time AI SSE token streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Long cache headers for immutable hashed Vite assets
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side React Router routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
